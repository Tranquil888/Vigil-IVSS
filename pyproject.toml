[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "2.0.0"
description = "Local video surveillance with dlib face recognition and a non-blocking display"
readme = "README.MD"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vigil contributors" }]
dependencies = [
    "PySide6-Essentials>=6.7",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<3",
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "tomlkit>=0.12",
    "tomli>=2.0; python_version<'3.11'",
    "psutil>=5.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyinstaller>=6.10",
    "alembic>=1.13",
]

[project.scripts]
vigil = "vigil.app:main"

[project.gui-scripts]
vigil-gui = "vigil.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vigil = ["gui/resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "gpu: requires a working CUDA dlib build",
    "models: requires downloaded dlib model files",
    "gui: requires a Qt platform plugin",
    "e2e: end-to-end tests with real threads and a synthetic video",
]

[tool.coverage.run]
source = ["vigil"]
