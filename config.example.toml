# Vigil configuration. Copy to %APPDATA%\Vigil\config.toml and edit.
# Values here are the shipped defaults. Every setting can also be changed in
# the Settings page, which writes this file back without dropping comments.

[app]
theme = "dark"          # system | dark | light
log_level = "INFO"
start_minimized = false

[inference]
device = "auto"         # auto | cpu | cuda:0
analysis_fps = 5        # face analysis rate per camera
queue_size = 4          # sampled frames waiting for inference; oldest is dropped
max_frame_age_s = 2     # ignore frames older than this

[face]
detector = "dlib_cnn"   # dlib_cnn | dlib_hog | none
known_threshold = 0.6   # calibrate against your gallery; see docs/calibration.md
unknown_threshold = 0.7 # must stay above known_threshold
margin = 0.05
min_votes = 2
min_face_px = 48
min_face_px_embed = 64
best_k = 5
uncertain_policy = "review"   # review | unknown | ignore
gallery_score = "min"         # min | top3_mean
max_detect_side = 800
unknown_merge_window_s = 60
unknown_merge_threshold = 0.6
track_iou = 0.3
track_max_gap_s = 1.0
models_dir = ""         # empty means <data dir>/models

[motion]
enabled = true
algorithm = "mog2"      # mog2 | running_avg | frame_diff
sample_every = 2
max_side = 320
threshold_pct = 2.0
min_area_px = 150
min_duration_frames = 3
cooldown_s = 5
suppress_global_pct = 50
preroll_s = 2

[display]
grid_fps = 15
single_fps = 30
overlay_ttl_s = 1.0

[notify]
desktop_enabled = true
sound_enabled = false
stranger_cooldown_s = 120

[capture]
stall_timeout_s = 10
backoff_initial_s = 1
backoff_max_s = 60
backoff_jitter = 0.2
offline_notify_after_s = 120
open_timeout_ms = 5000
buffer_size = 1

[storage]
data_dir = ""           # empty means %LOCALAPPDATA%\Vigil
event_retention_days = 90
log_retention_days = 14
snapshot_jpeg_quality = 90

[[cameras]]
id = "front"
name = "Front door"
source = "rtsp://user:password@192.168.1.10:554/stream2"
enabled = true
analysis_stream = "sub"
snapshot_enabled = true

# A camera can override any global section it needs.
# [cameras.motion]
# threshold_pct = 4.0

[[cameras.zones]]
name = "walkway"
points = [[0.30, 0.35], [0.80, 0.35], [0.85, 0.90], [0.25, 0.90]]
threshold_pct = 2.0
exclude = false

[[cameras.zones]]
name = "timestamp"
points = [[0.00, 0.00], [0.25, 0.00], [0.25, 0.10], [0.00, 0.10]]
exclude = true
